name: Fetch Tennis Data

on:
  # March–June only, every 4 hours. The 2027 season starts the second week of
  # March; outside those months this never fires, so it is safe to leave armed.
  schedule:
    - cron: '0 */4 * 3-6 *'
  workflow_dispatch: # Allow manual triggers
    inputs:
      year:
        description: 'Season to refresh'
        required: false
        default: '2027'

env:
  SEASON: ${{ github.event.inputs.year || '2027' }}

jobs:
  # Gate the data commit on the test suite. This pipeline writes the numbers the
  # site publishes; a broken adapter or a shifted Power Index should stop the
  # run, not get committed at four in the morning.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node --test "netlify/functions/*.test.mjs"

  fetch-data:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests geopy numpy 'psycopg[binary]'

      - name: Discover active schools (most wins)
        run: python fetch_most_wins.py --year "$SEASON"

      - name: Fetch boys data
        run: python fetch_data.py --year "$SEASON" --gender 1 --output "data/$SEASON"

      - name: Fetch girls data
        run: python fetch_data.py --year "$SEASON" --gender 2 --output "data/$SEASON"

      # Coach-entered duals. continue-on-error is on the export ONLY: a database
      # blip must never take the site build down. With no bundle the merge is a
      # no-op and the site builds from the scrape alone, exactly as it does today.
      - name: Export coach-entered duals
        continue-on-error: true
        env:
          DATABASE_URL_RO: ${{ secrets.DATABASE_URL_RO }}
        run: python export_entered_meets.py --year "$SEASON"

      - name: Merge entered duals over the scrape
        run: python merge_entered_data.py --year "$SEASON"

      # generate_site.py also builds the lineup data and the seeding packets.
      - name: Regenerate site
        run: python generate_site.py

      - name: Generate weekly rankings
        run: python scripts/generate_weekly_rankings.py --all

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/$SEASON/" index.html public/ oregon_schools.csv
          [ -d data_jv ] && git add data_jv/ || true
          [ -d entered ] && git add entered/ || true
          git diff --staged --quiet || (git commit -m "Update $SEASON tennis data $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
