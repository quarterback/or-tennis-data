<script>/* palette: ?palette=cool|warm|cheese, remembered after */(()=>{try{const u=new URLSearchParams(location.search).get('palette');if(u)localStorage.setItem('cb_palette',u);const p=localStorage.getItem('cb_palette');if(p&&p!=='cheese')document.documentElement.setAttribute('data-palette',p);}catch(e){}})()</script>
<style>
  /* This page sits on css/brand.css like every other Cheesybook page: the
     masthead, .wrap, .panel, the tables, the buttons and the controls bar all
     come from there. What is left here is what only a lineup page needs.

     The heat ramp is the one thing kept literal. It encodes how often a player
     appeared at a position and needs five steps that stay apart from each
     other, which a token pair cannot give it. */
  :root {
    --heat0: #fff9e6; --heat1: #ffeeba; --heat2: #ffd97a; --heat3: #f0ac3c; --heat4: #c97e1c;
  }

  /* Wide tables scroll inside their panel instead of widening the page. */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .header-bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 12px 16px; margin: 14px 0;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 10px; box-shadow: var(--shadow);
  }
  .header-bar label { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; color: var(--ink-3); min-width: 0; }
  .header-bar select { min-width: 0; max-width: 100%; }
  .header-bar .backend { margin-left: auto; font-size: 0.76rem; color: var(--ink-3); }
  .header-bar .backend.ok { color: var(--win); }
  .header-bar .backend.fail { color: var(--flag); }

  /* Same tabs as the team page: each choice carries its own field so the two
     read as navigation rather than as a line of text. */
  .tabs {
    display: flex; gap: 6px; margin: 20px 0 0;
    border-bottom: 2px solid var(--ink);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { height: 0; }
  .tabs .tab {
    flex: none; background: var(--rule-2); border: 0;
    border-radius: 7px 7px 0 0;
    padding: 9px 20px; font-size: 0.9rem; font-weight: 600;
    color: var(--ink-2); cursor: pointer; white-space: nowrap;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tabs .tab:hover { background: var(--rule); color: var(--ink); }
  .tabs .tab.active {
    color: var(--accent-2); font-weight: 700;
    background: var(--accent-wash); border-bottom-color: var(--accent);
  }
  .tabs .tab.active:hover { background: var(--accent-wash); }
  .tab-pane { display: none; } .tab-pane.active { display: block; }

  /* .card is this page's name for .panel. Kept, because the markup and the
     mobile rules below key off it. */
  .card {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 10px; box-shadow: var(--shadow);
    margin: 16px 0; overflow: hidden;
  }
  .card-head {
    padding: 11px 16px; border-bottom: 1px solid var(--rule);
    background: var(--paper-2);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-size: 0.92rem; font-weight: 700; color: var(--ink-2);
  }
  .card-body { padding: 14px 16px; }
  .card-body.flush { padding: 0; }

  .small { font-size: 0.82rem; }

  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-size: 0.68rem; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
  }
  .pill.s { background: var(--accent-wash); color: var(--accent-2); }
  .pill.d { background: var(--rule); color: var(--ink-2); }
  .pill.lock { background: var(--win-wash); color: var(--win); }
  .pill.open { background: var(--flag-wash); color: var(--flag); }
  .pill.derived, .pill.grade { background: var(--rule-2); color: var(--ink-3); }

  .poschip {
    display: inline-flex; align-items: baseline; gap: 4px;
    background: var(--paper-2); border: 1px solid var(--rule);
    border-radius: 6px; padding: 2px 7px; font-size: 0.75rem;
    margin: 1px 3px 1px 0; white-space: nowrap;
  }
  .poschip.primary { border-color: var(--accent); background: var(--accent-wash); }
  .poschip b { font-weight: 700; }

  /* ladder */
  td.n, th.n { text-align: center; font-variant-numeric: tabular-nums; }
  .ladder-row td { vertical-align: middle; }
  /* A player's own page, reachable from the row without disturbing the
     ordering control that occupies the name cell. */
  .pcard-link { font-size: 0.72rem; margin-left: 8px; white-space: nowrap; }
  .rank { font-weight: 700; font-size: 1.05rem; width: 34px; text-align: center; color: var(--ink); }
  .pos-select { min-width: 190px; max-width: 100%; }
  .move-btns { display: inline-flex; gap: 3px; }
  .delta { font-size: 0.72rem; margin-left: 6px; }
  .delta.up { color: var(--win); } .delta.down { color: var(--loss); }

  /* matrix */
  .matrix th.slot, .matrix td.slot { text-align: center; width: 44px; }
  .matrix td.slot { font-weight: 600; }
  .matrix td.slot.z { color: var(--ink-4); font-weight: 400; }
  .matrix .name { min-width: 170px; }
  .matrix td.name a { color: var(--accent); }
  .spread { font-size: 0.78rem; }
  .flag { color: var(--flag); font-weight: 600; }
  .heat0{background:var(--heat0)} .heat1{background:var(--heat1)} .heat2{background:var(--heat2)}
  .heat3{background:var(--heat3);color:#fff} .heat4{background:var(--heat4);color:#fff}

  .log { display: none; background: var(--paper-2); }
  .log td { padding: 0; }
  .log-inner { padding: 8px 12px 12px; }
  .log table { font-size: 0.8rem; }
  .status { font-size: 0.84rem; }
  .status.ok { color: var(--win); } .status.err { color: var(--loss); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--ink-3); margin-top: 10px; }
  .legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .submit-bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 16px; margin: 16px 0;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 10px; box-shadow: var(--shadow);
  }

  /* ===== Mobile ===== */
  @media (max-width: 640px) {
    /* Filters go two-up and full-width; the 16px/40px sizing that stops iOS
       zooming on focus is in brand.css and applies here. */
    .header-bar { gap: 10px; padding: 12px; }
    .header-bar label { flex: 1 1 44%; flex-direction: column; align-items: stretch; gap: 3px;
                        font-size: 0.72rem; text-transform: uppercase; letter-spacing: .03em; }
    .header-bar select { width: 100%; min-width: 0 !important; }
    .header-bar .backend { flex-basis: 100%; margin-left: 0; text-align: right; }

    .tabs .tab { padding: 9px 13px; }

    /* Ladder becomes one card per player.
       As a four-column table the name dropdown gets whatever width is left
       after the position chips, which on a phone is enough for "Eva Bl…".
       Stacking gives the name the full width and lets the chips wrap under it,
       which is the only way this is usable on the device most coaches have in
       their hand at a match. */
    #ladder-table, #ladder-table tbody, #ladder-table tr, #ladder-table td { display: block; width: 100%; }
    #ladder-table thead { display: none; }
    #ladder-table .ladder-row {
      border: 1px solid var(--rule); border-radius: 10px;
      /* Top padding clears the absolutely-positioned position badge, which
         otherwise draws over the name select. */
      padding: 26px 12px 12px; margin-bottom: 10px; background: var(--paper);
      position: relative;
    }
    #ladder-table .ladder-row td { border: 0; padding: 3px 0; }
    #ladder-table .ladder-row:hover td { background: none; }
    /* Rank sits as a badge in the corner rather than its own column. */
    #ladder-table .rank {
      position: absolute; top: 10px; right: 12px; width: auto;
      font-size: 0.72rem; font-weight: 700; color: var(--ink-3);
      text-transform: uppercase; letter-spacing: .06em;
    }
    #ladder-table .rank::before { content: 'Position '; }
    .pos-select { width: 100%; min-width: 0; }
    /* Overall record loses its header when the table stacks, so name it. */
    #ladder-table .ladder-row td.n { text-align: left; font-size: 0.82rem; color: var(--ink-3); }
    #ladder-table .ladder-row td.n::before { content: 'Overall '; }

    .submit-bar { flex-direction: column; align-items: stretch; }
    .submit-bar > * { width: 100%; }

    /* Matrix stays dense but scrolls sideways inside its wrapper */
    .matrix th, .matrix td { padding: 6px 4px; }
    .card-head { flex-wrap: wrap; }
    #matrix-summary, #ladder-updated { margin-left: 0 !important; flex-basis: 100%; }
  }
</style>
</head>
<body>

<header class="mast"></header>

<div class="wrap">
  <div class="pagehead">
    <h1>Lineups</h1>
  </div>

<div class="header-bar">
  <label>Year
    <select id="sel-year"></select>
  </label>
  <label>Class

<!-- ===================== LADDER TAB ===================== -->

            <th class="slot">1D</th><th class="slot">2D</th><th class="slot">3D</th><th class="slot">4D</th>
            <th class="n">Total</th><th class="n">Rec</th>
          </tr></thead>
          <tbody id="matrix-body"></tbody>
        </table>
        </div>
        <div class="legend">
          <span><span class="sw heat1"></span>1</span>
          <span><span class="sw heat2"></span>2–3</span>

</div><!-- /.wrap -->

<script type="module">
import { applyBrand } from './js/brand.js';
applyBrand('Lineups', {
  current: 'Lineups',
  links: [
    { href: 'cheesybook.html', label: 'Home' },
    { href: 'scoreboard.html', label: 'Scoreboard' },
    { href: 'teams.html', label: 'Teams' },
    { href: 'lineups.html', label: 'Lineups' },
    { href: 'coach.html', label: 'Report' },
    { href: 'index.html', label: 'Rankings' },
  ],
});
</script>

<script>
const SLOTS = ['S1','S2','S3','S4','D1','D2','D3','D4'];
const SLOT_LABEL = {S1:'1S',S2:'2S',S3:'3S',S4:'4S',D1:'1D',D2:'2D',D3:'3D',D4:'4D'};
const API_BASE = '/api/lineups';

let INDEX = null;         // index.json
let detail = null;        // current team detail
let workingOrder = [];    // array of pids in current ladder order
let derivedOrder = [];    // array of pids in data-derived order
let stored = null;        // submitted ladder from backend
let backendOk = false;

// ---------- backend ----------
async function checkBackend() {
  const el = document.getElementById('backend');
  try {
    const r = await fetch(`${API_BASE}/__ping`);
    backendOk = r.ok || r.status === 404;
  } catch { backendOk = false; }
  el.textContent = backendOk ? 'Backend: ✓ syncing' : 'Backend: ✗ view-only (offline)';
  el.className = 'backend ' + (backendOk ? 'ok' : 'fail');
}

function teamId() { // blob id: <year>_<key>
  return `${document.getElementById('sel-year').value}_${detail.key}`;
}

async function loadStored() {
  stored = null;
  if (!backendOk || !detail) return;
  try {
    const r = await fetch(`${API_BASE}/${encodeURIComponent(teamId())}`);
    if (r.ok) stored = await r.json();
  } catch {}
}

// ---------- data load ----------
async function boot() {
  await checkBackend();
  try {
    const r = await fetch('data/lineups/index.json');
    INDEX = await r.json();
  } catch (e) {
    document.getElementById('ladder-empty').textContent = 'Could not load lineup data.';
    return;
  }
  const ySel = document.getElementById('sel-year');
  INDEX.generated_years.slice().reverse().forEach(y => {
    const o = document.createElement('option'); o.value = y; o.textContent = y; ySel.appendChild(o);
  });
  refreshClassOptions();
  refreshDistrictOptions();
  refreshTeamOptions();
}

function currentTeams() {
  const y = document.getElementById('sel-year').value;
  return (INDEX.teams[y] || []);
}
function refreshClassOptions() {
  const sel = document.getElementById('sel-class');
  const cur = sel.value;
  const classes = [...new Set(currentTeams().map(t => t.classification).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All</option>' + classes.map(c => `<option${c===cur?' selected':''}>${c}</option>`).join('');
}
function refreshDistrictOptions() {
  const cls = document.getElementById('sel-class').value;
  const gen = document.getElementById('sel-gender').value;
  const sel = document.getElementById('sel-district');
  const cur = sel.value;
  const districts = [...new Set(currentTeams()
    .filter(t => (!cls || t.classification === cls) && (!gen || t.gender === gen))
    .map(t => t.league).filter(Boolean))].sort();
  const keep = districts.includes(cur) ? cur : '';
  sel.innerHTML = '<option value="">All</option>' +
    districts.map(d => `<option${d===keep?' selected':''}>${escapeHtml(d)}</option>`).join('');
}
function refreshTeamOptions() {
  const cls = document.getElementById('sel-class').value;
  const dist = document.getElementById('sel-district').value;
  const gen = document.getElementById('sel-gender').value;
  const sel = document.getElementById('sel-team');
  const teams = currentTeams()
    .filter(t => (!cls || t.classification === cls) && (!dist || t.league === dist) && (!gen || t.gender === gen))
    .sort((a,b) => a.name.localeCompare(b.name) || a.gender.localeCompare(b.gender));
  sel.innerHTML = '<option value="">— select a team —</option>' +
    teams.map(t => `<option value="${t.key}">${escapeHtml(t.name)} — ${t.gender} (${t.classification||'?'})</option>`).join('');
}

async function selectTeam(key) {
  const y = document.getElementById('sel-year').value;
  if (!key) { detail = null; render(); return; }
  try {
    const r = await fetch(`data/lineups/${y}/${key}.json`);
    detail = await r.json();
    detail.key = key;
  } catch { detail = null; }
  derivedOrder = detail ? detail.ladder.map(p => p.pid) : [];
  await loadStored();
  workingOrder = (stored && stored.ladder && stored.ladder.length)
    ? stored.ladder.slice().filter(pid => derivedOrder.includes(pid))
        .concat(derivedOrder.filter(pid => !stored.ladder.includes(pid)))
    : derivedOrder.slice();
  document.getElementById('chk-lock').checked = !!(stored && stored.locked);
  render();
}

// ---------- rendering ----------
function playerByPid(pid) { return detail.ladder.find(p => p.pid === pid); }

/** The lineups data file key for the team on screen, e.g. "1124656". */
function teamKey() { return document.getElementById('sel-team').value; }

function recStr(rec) { return rec && (rec[0] || rec[1]) ? `${rec[0]}–${rec[1]}` : '–'; }

// Chips for the courts a player actually played, in strength order, each with
// that court's win-loss record. The player's most-played court is emphasized.
function posChips(p) {
  const rs = p.rec_slots || {};
  const chips = SLOTS.filter(s => rs[s]).map(s => {
    const [w, l] = rs[s];
    const kind = s[0] === 'S' ? 's' : 'd';
    const primary = s === p.primary ? ' primary' : '';
    return `<span class="poschip ${kind}${primary}"><b>${SLOT_LABEL[s]}</b> ${w}–${l}</span>`;
  });
  return chips.length ? chips.join('') : '<span class="muted">—</span>';
}

function render() {
  const has = !!detail;
  document.getElementById('ladder-empty').style.display = has ? 'none' : '';
  document.getElementById('ladder-content').style.display = has ? '' : 'none';
  document.getElementById('matrix-empty').style.display = has ? 'none' : '';
  document.getElementById('matrix-content').style.display = has ? '' : 'none';
  if (!has) return;
  renderLadder();
  renderMatrix();
}

function renderLadder() {
  document.getElementById('ladder-team-name').textContent =
    `${detail.name} — ${detail.gender} ${detail.classification||''}`;
  const coachSet = !!(stored && stored.ladder && stored.ladder.length);
  const lp = document.getElementById('ladder-lockpill');
  if (coachSet && stored.locked) lp.innerHTML = '<span class="pill lock">Coach ladder · locked</span>';
  else if (coachSet) lp.innerHTML = '<span class="pill open">Coach ladder · draft</span>';
  else lp.innerHTML = '<span class="pill derived">Data-derived order · coach hasn\'t set a ladder</span>';
  document.getElementById('ladder-updated').textContent =
    stored && stored.updatedAt ? 'Updated ' + fmtDate(stored.updatedAt) : '';

  // Options list (stable player order) reused by every position dropdown.
  const opts = detail.ladder.map(p =>
    `<option value="${p.pid}">${escapeHtml(p.name)}${p.grade?` (gr ${escapeHtml(p.grade)})`:''}</option>`
  ).join('');

  const body = document.getElementById('ladder-body');
  body.innerHTML = '';
  workingOrder.forEach((pid, i) => {
    const p = playerByPid(pid);
    if (!p) return;
    const tr = document.createElement('tr');
    tr.className = 'ladder-row';
    tr.innerHTML =
      `<td class="rank">${i+1}</td>` +
      `<td><select class="pos-select" data-pos="${i}">${opts}</select>` +
        `<a class="pcard-link" href="player.html?t=${encodeURIComponent(teamKey())}&p=${encodeURIComponent(pid)}" title="Player card">card</a></td>` +
      `<td>${posChips(p)}</td>` +
      `<td class="n">${recStr(p.rec)}</td>`;
    tr.querySelector('select').value = pid;
    body.appendChild(tr);
  });
  body.querySelectorAll('.pos-select').forEach(sel =>
    sel.onchange = () => setPos(+sel.dataset.pos, sel.value)
  );
}

// Assign a player to a ladder position; if they already sit elsewhere, swap so
// the ladder stays a clean permutation with no duplicates or gaps.
function setPos(i, pid) {
  const j = workingOrder.indexOf(pid);
  if (j === i) return;
  if (j >= 0) { workingOrder[j] = workingOrder[i]; }
  workingOrder[i] = pid;
  renderLadder();
}

function heatClass(n) { return n===0?'heat0':n===1?'heat1':n<=3?'heat2':n<=6?'heat3':'heat4'; }

function renderMatrix() {
  document.getElementById('matrix-team-name').textContent =
    `${detail.name} — ${detail.gender} ${detail.classification||''}`;
  document.getElementById('matrix-summary').textContent =
    `${detail.ladder.length} players · record ${detail.record.win}-${detail.record.loss}${detail.record.tie?'-'+detail.record.tie:''}`;
  const body = document.getElementById('matrix-body');
  body.innerHTML = '';
  detail.ladder.forEach((p, idx) => {
    const cells = SLOTS.map(s => {
      const n = p.slots[s];
      const wl = (p.rec_slots || {})[s];
      const title = wl ? `${SLOT_LABEL[s]}: ${wl[0]}–${wl[1]}` : '';
      return `<td class="slot ${n?heatClass(n):'z'}"${title?` title="${title}"`:''}>${n||'·'}</td>`;
    }).join('');
    const tr = document.createElement('tr');
    tr.dataset.pid = p.pid;
    tr.style.cursor = 'pointer';
    tr.innerHTML =
      `<td class="name"><a href="player.html?t=${encodeURIComponent(teamKey())}&p=${encodeURIComponent(p.pid)}">${escapeHtml(p.name)}</a></td>` +
      `<td class="small muted">${escapeHtml(p.grade||'')}</td>` +
      cells +
      `<td class="n">${p.total}</td>` +
      `<td class="n">${recStr(p.rec)}</td>`;
    body.appendChild(tr);
    const log = document.createElement('tr');
    log.className = 'log'; log.id = 'log-' + p.pid;
    log.innerHTML = `<td colspan="12"><div class="log-inner">${matchLog(p)}</div></td>`;
    body.appendChild(log);
    tr.onclick = () => { const el = document.getElementById('log-'+p.pid); el.style.display = el.style.display==='table-row'?'none':'table-row'; };
  });
}

function matchLog(p) {
  if (!p.matches.length) return '<span class="muted small">No matches.</span>';
  const rows = p.matches.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(m =>
    `<tr><td>${escapeHtml(m.date||'')}</td>` +
    `<td><span class="pill ${m.slot[0]==='S'?'s':'d'}">${SLOT_LABEL[m.slot]}</span></td>` +
    `<td>${m.won?'<span style="color:var(--green);font-weight:600">W</span>':'<span style="color:var(--red)">L</span>'}</td>` +
    `<td style="font-variant-numeric:tabular-nums;white-space:nowrap">${escapeHtml(m.score||'')}</td>` +
    `<td>${escapeHtml(m.opp||'')}</td>` +
    `<td class="small muted">${m.post?'<span class="pill d">post</span>':''} ${escapeHtml(m.meet||'')}</td></tr>`
  ).join('');
  return `<table><thead><tr><th>Date</th><th>Position</th><th>Res</th><th>Score</th><th>Opponent</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---------- submit ----------
async function submitLadder() {
  const st = document.getElementById('submit-status');
  if (!backendOk) { st.textContent = 'Backend offline — cannot submit.'; st.className='status err'; return; }
  st.textContent = 'Submitting…'; st.className = 'status';
  try {
    // No access code while the tool is being demonstrated: a coach or an AD
    // being shown the ladder needs to be able to submit one. The header is
    // still read server-side, so restoring the gate is putting the field back.
    const r = await fetch(`${API_BASE}/${encodeURIComponent(teamId())}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ladder: workingOrder, locked: document.getElementById('chk-lock').checked }),
    });
    const j = await r.json();
    if (!r.ok) { st.textContent = j.error || ('Error ' + r.status); st.className = 'status err'; return; }
    st.textContent = j.locked ? 'Saved & locked ✓' : 'Saved ✓'; st.className = 'status ok';
    await loadStored();
    renderLadder();
  } catch (e) {
    st.textContent = 'Network error.'; st.className = 'status err';
  }
}

// ---------- utils ----------
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(iso){ try { return new Date(iso).toLocaleString(); } catch { return iso; } }

// ---------- wire up ----------
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('pane-'+t.dataset.tab).classList.add('active');
});
document.getElementById('sel-year').onchange = () => { refreshClassOptions(); refreshDistrictOptions(); refreshTeamOptions(); selectTeam(''); document.getElementById('sel-team').value=''; };
document.getElementById('sel-class').onchange = () => { refreshDistrictOptions(); refreshTeamOptions(); };
document.getElementById('sel-district').onchange = refreshTeamOptions;
document.getElementById('sel-gender').onchange = () => { refreshDistrictOptions(); refreshTeamOptions(); };
document.getElementById('sel-team').onchange = (e) => selectTeam(e.target.value);
document.getElementById('btn-reset-order').onclick = () => { workingOrder = derivedOrder.slice(); renderLadder(); };
document.getElementById('btn-submit').onclick = submitLadder;

boot();
</script>
