<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teams — Cheesybook</title>
<meta name="theme-color" content="#6a3937">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/brand.css">
<script>/* palette: ?palette=cool|warm|cheese, remembered after */(()=>{try{const u=new URLSearchParams(location.search).get('palette');if(u)localStorage.setItem('cb_palette',u);const p=localStorage.getItem('cb_palette');if(p&&p!=='cheese')document.documentElement.setAttribute('data-palette',p);}catch(e){}})()</script>
<style>
  /* The way into every team page. Without this the team pages exist and
     nothing points at them unless you happen to be on a scoreboard card. */
  .findbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 16px; }
  .findbar input { flex: 1 1 240px; min-height: 40px; font-size: 16px; }

  /* Standings, not cards. A box per team ate the page; a league is a table. */
  .lg { margin: 0 0 20px; }
  .lg > h2 {
    font-size: 0.92rem; font-weight: 700; margin: 0 0 4px;
    padding-bottom: 4px; border-bottom: 2px solid var(--ink);
  }
  table.stand { width: 100%; border-collapse: collapse; }
  table.stand th {
    position: static; background: none; border-bottom: 1px solid var(--rule);
    font-size: 0.66rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-3); padding: 5px 8px; text-align: left; white-space: nowrap;
  }
  table.stand td { padding: 6px 8px; border-bottom: 1px solid var(--rule-2); font-size: 0.87rem; }
  table.stand tr:last-child td { border-bottom: 0; }
  table.stand tbody tr:hover td { background: var(--paper-2); }
  table.stand .pos { color: var(--ink-3); font-variant-numeric: tabular-nums; width: 26px; text-align: right; }
  table.stand .nm { font-weight: 600; }
  table.stand .nm a { color: inherit; }
  table.stand .nm a:hover { color: var(--accent); }
  table.stand .rk { font-weight: 400; color: var(--ink-3); font-size: 0.78rem; margin-right: 5px; }
  table.stand .rec { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; width: 4.5rem; }
  table.stand th.rec { text-align: right; }
  table.stand .lead { font-weight: 700; }

  .sortby { display: flex; gap: 4px; align-items: center; margin-left: auto; }
  .sortby button { padding: 5px 11px; font-size: 0.78rem; }
  .sortby button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
</style>
</head>
<body>
<header class="mast"></header>

<div class="wrap">
  <div class="pagehead">
    <h1>Teams</h1>
  </div>

  <div class="findbar">
    <input type="search" id="q" placeholder="Find a school…" autocomplete="off">
    <label class="tiny muted">Gender
      <select id="gender"><option>Girls</option><option>Boys</option></select></label>
    <label class="tiny muted">Class <select id="class"></select></label>
    <span class="sortby">
      <button data-sort="league" class="on">League</button>
      <button data-sort="overall">Overall</button>
    </span>
  </div>

  <div id="list"></div>
  <div id="empty" class="empty" style="display:none"></div>
</div>

<script type="module">
import { applyBrand, leagueKey, leagueLabel } from './js/brand.js';

applyBrand('Teams', {
  current: 'Teams',
  links: [
    { href: 'cheesybook.html', label: 'Home' },
    { href: 'scoreboard.html', label: 'Scoreboard' },
    { href: 'teams.html', label: 'Teams' },
    { href: 'lineups.html', label: 'Lineups' },
    { href: 'coach.html', label: 'Report' },
    { href: 'index.html', label: 'Rankings' },
  ],
});

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const YEAR = 2026;
let index = null;
let sortBy = 'league';
const cache = new Map();

/** W-L-T as a fraction, a tie counting half — the same convention as the record. */
function pct(rec) {
  const [w, l, t] = String(rec || '0-0-0').split('-').map(Number);
  const played = (w || 0) + (l || 0) + (t || 0);
  return played ? ((w || 0) + (t || 0) * 0.5) / played : -1;
}

async function boot() {
  index = await fetch(`data/committee/${YEAR}/index.json`).then((r) => r.json());
  const classes = [...new Set(index.fields.map((f) => f.classification))];
  document.getElementById('class').innerHTML =
    '<option value="">All</option>' + classes.map((c) => `<option>${esc(c)}</option>`).join('');

  // The search box listens on input only. With change as well, clicking a
  // result blurred the box, fired change, and re-rendered the list — which
  // removed the anchor under the cursor before the click landed, so nothing
  // navigated. The selects legitimately need change.
  document.getElementById('q').oninput = render;
  document.getElementById('gender').onchange = render;
  document.getElementById('class').onchange = render;
  document.querySelectorAll('.sortby button').forEach((b) => {
    b.onclick = () => {
      sortBy = b.dataset.sort;
      document.querySelectorAll('.sortby button')
        .forEach((x) => x.classList.toggle('on', x.dataset.sort === sortBy));
      render();
    };
  });
  await render();
}

/** Every team in the chosen gender, across the classifications. */
async function teams() {
  const gender = document.getElementById('gender').value.toLowerCase();
  const cls = document.getElementById('class').value;
  const fields = index.fields.filter((f) =>
    f.gender.toLowerCase() === gender && (!cls || f.classification === cls));

  const out = [];
  for (const f of fields) {
    if (!cache.has(f.file)) {
      cache.set(f.file, await fetch(`data/committee/${YEAR}/${f.file}`).then((r) => r.json()));
    }
    const data = cache.get(f.file);
    for (const t of data.teams) out.push({ ...t, gender, classification: data.classification });
  }
  return out;
}

async function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let list = await teams();
  if (q) list = list.filter((t) => t.name.toLowerCase().includes(q));

  const el = document.getElementById('list');
  const empty = document.getElementById('empty');
  if (!list.length) {
    el.innerHTML = '';
    empty.style.display = '';
    empty.textContent = 'No school by that name.';
    return;
  }
  empty.style.display = 'none';

  // Grouped by league — keyed on classification too, because 6A, 5A and
  // 4A/3A/2A/1A each have a Special District 1 and they are not the same league.
  const byLeague = new Map();
  for (const t of list) {
    const k = t.league ? leagueKey(t.classification, t.league) : '|No league';
    if (!byLeague.has(k)) byLeague.set(k, { label: t.league ? leagueLabel(t.classification, t.league) : 'No league', teams: [] });
    byLeague.get(k).teams.push(t);
  }

  el.innerHTML = [...byLeague.entries()].sort().map(([, group]) => {
    const league = group.label;
    const ts = group.teams;
    // Standings order follows whichever record is being stood on, with the
    // other as the tiebreak and Power Index behind that.
    const key = (t) => (sortBy === 'league' ? t.leagueRecord : t.record);
    const other = (t) => (sortBy === 'league' ? t.record : t.leagueRecord);
    ts.sort((a, b) =>
      pct(key(b)) - pct(key(a))
      || pct(other(b)) - pct(other(a))
      || (b.powerIndex || 0) - (a.powerIndex || 0));

    const rows = ts.map((t, i) => `<tr>
      <td class="pos">${i + 1}</td>
      <td class="nm">${t.classRank ? `<span class="rk">#${t.classRank}</span>` : ''}<a href="team.html?s=${encodeURIComponent(t.schoolId)}&g=${esc(t.gender)}">${esc(t.name)}</a></td>
      <td class="rec ${sortBy === 'league' ? 'lead' : ''}">${esc(t.leagueRecord || '')}</td>
      <td class="rec ${sortBy === 'overall' ? 'lead' : ''}">${esc(t.record || '')}</td>
    </tr>`).join('');

    return `<section class="lg">
      <h2>${esc(league)}</h2>
      <table class="stand">
        <thead><tr>
          <th></th><th>Team</th><th class="rec">League</th><th class="rec">Overall</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </section>`;
  }).join('');
}

boot();
</script>
</body>
</html>
