<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoreboard</title>
<meta name="theme-color" content="#14181f">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/brand.css">
<script>/* palette: ?palette=cool|warm|cheese, remembered after */(()=>{try{const u=new URLSearchParams(location.search).get('palette');if(u)localStorage.setItem('cb_palette',u);const p=localStorage.getItem('cb_palette');if(p&&p!=='cheese')document.documentElement.setAttribute('data-palette',p);}catch(e){}})()</script>
<style>
  /* The games are the product; the filters are tools. The page opens on a
     day's results, with one row of date navigation above them and everything
     else folded away. */
  .datebar {
    display: flex; gap: 8px; align-items: center;
    position: sticky; top: 0; z-index: 30;
    background: var(--paper-2); padding: 10px 0 8px;
  }
  .daynav {
    flex: none; width: 34px; padding: 0; height: 34px; font-size: 1.1rem; line-height: 1;
  }
  .daystrip {
    display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth; flex: 1; min-width: 0; padding-bottom: 2px;
  }
  .daystrip::-webkit-scrollbar { height: 0; }
  .daystrip button {
    white-space: nowrap; flex: none; font-weight: 600;
    border-radius: 999px; padding: 6px 13px;
  }
  .daystrip button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .daystrip button.today { border-color: var(--accent); }
  .filters-toggle { flex: none; }
  .filters-toggle.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* display:flex beats the hidden attribute, so say so explicitly or the
     drawer ships open and the filters are back on top of the games. */
  .drawer[hidden] { display: none; }
  .drawer {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .drawer label { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--ink-3); min-width: 0; }
  .drawer select, .drawer input { min-width: 0; max-width: 100%; }

  .activefilters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .activefilters .chip { cursor: pointer; }

  .dayhead {
    font-family: var(--display-font); font-size: 1.15rem; margin: 4px 0 12px;
    letter-spacing: .01em;
  }

  /* Grouping: gender, then how the dual counted. A reader scans to their
     half of the page and then to the kind of match they care about. */
  .grp { margin: 0 0 22px; }
  .grp > h2 {
    font-family: var(--display-font); font-size: 1rem; margin: 0 0 8px;
    padding-bottom: 5px; border-bottom: 2px solid var(--ink); letter-spacing: .02em;
  }
  .sub-grp { margin: 0 0 14px; }
  .sub-grp > h3 {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-3); margin: 12px 0 7px; font-weight: 700;
  }

  /* align-items:start so expanding one box score does not stretch every card
     in its row to match. */
  .slate { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 10px; align-items: start; }
  .game {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .game-head {
    display: flex; align-items: center; gap: 7px; padding: 6px 11px 0;
    font-size: 0.62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3);
  }
  /* FINAL sits where a scoreboard puts it: first, small, and unmissable. */
  .game-head .final { color: var(--ink); }
  .game-head .tag { font-weight: 700; color: var(--accent-2); }
  /* The record rides with the name at a smaller weight, like ESPN's (12-3). */
  .team-row .name .rec { font-weight: 400; color: var(--ink-3); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  .team-row {
    display: flex; align-items: center; gap: 9px; padding: 6px 11px;
  }
  .team-row + .team-row { border-top: 0; }
  .team-row .name { flex: 1; font-weight: 600; font-size: 0.92rem; }
  .team-row { text-decoration: none; color: inherit; }
  /* Give the row a visible affordance — without one it reads as static text. */
  .team-row:hover { background: var(--accent-wash); text-decoration: none; }
  .team-row:hover .name { color: var(--accent-2); }
  /* ESPN marks the winner with a caret at the row's left edge. The column is
     always present so the two rows stay aligned. */
  .team-row .mark { width: 9px; color: var(--ink); font-size: 0.72rem; }
  /* The classification and league sit once at the foot of the card, not on
     every row — metadata supports the score rather than competing with it. */
  .team-row .name .meta { display: none; }
  .game-meta {
    padding: 2px 11px 0; font-size: 0.68rem; color: var(--ink-3);
  }
  .team-row .score { font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 24px; text-align: right; line-height: 1.15; }
  .team-row.won .score, .team-row.won .name { color: var(--ink); }
  .team-row.lost .score, .team-row.lost .name { color: var(--ink-4); }
  /* The tiebreak reads as one line under the score, the way a soccer page
     prints PKs (4-3) — not as a figure split across the two team rows. */
  .game-tb {
    padding: 0 11px 2px; text-align: right;
    font-size: 0.72rem; color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .game-foot {
    padding: 5px 11px 7px;
    display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--ink-3);
  }
  .game-foot button {
    padding: 2px 9px; font-size: 0.68rem; margin-left: auto;
    text-transform: uppercase; letter-spacing: .05em;
  }

  /* The card clips its corners, so the box score has to scroll inside itself
     rather than be cut off — the set scores are the point of opening it. */
  .box { border-top: 1px solid var(--rule); padding: 4px 0 8px; background: var(--paper-2); overflow-x: auto; }
  .box table { font-size: 0.78rem; min-width: 100%; }
  .box th { position: static; background: transparent; padding: 5px 12px; }
  .box td { padding: 5px 12px; border-bottom: 1px solid var(--rule-2); }
  .box td:nth-child(2), .box td:nth-child(3) { min-width: 108px; }
  .box tr:last-child td { border-bottom: 0; }
  .box .slot { font-weight: 700; color: var(--ink-3); width: 30px; }
  .box .w { font-weight: 700; }
  .box .l { color: var(--ink-3); }
  .box .sc { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .box td a, .box th a { color: inherit; text-decoration: none; }
  .box td a:hover, .box th a:hover { color: var(--accent); text-decoration: underline; }
  .box .fin { font-size: 0.68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--flag); }
</style>
</head>
<body>
<header class="mast"></header>

<div class="wrap">
  <!-- Date navigation is the page's primary control, so it leads and it
       sticks. Everything else is a tool and lives behind Filters. -->
  <div class="datebar">
    <button class="daynav" id="prev" aria-label="Previous day">&lsaquo;</button>
    <div class="daystrip" id="daystrip"></div>
    <button class="daynav" id="next" aria-label="Next day">&rsaquo;</button>
    <button id="filters-toggle" class="filters-toggle">Filters</button>
  </div>

  <div class="drawer" id="drawer" hidden>
    <label>Season <select id="year"></select></label>
    <label>Date <select id="date"></select></label>
    <label>Gender <select id="gender">
      <option value="">Both</option><option>Boys</option><option>Girls</option></select></label>
    <label>Class <select id="class"><option value="">All</option></select></label>
    <label>League <select id="league"><option value="">All</option></select></label>
    <input type="search" id="q" placeholder="Find a school…">
    <button id="drawer-clear" class="ghost">Clear</button>
  </div>

  <div id="active-filters" class="activefilters"></div>

  <h1 class="dayhead" id="dayhead"></h1>

  <div id="slate"></div>
  <div id="empty" class="empty" style="display:none"></div>
</div>

<script type="module">
import { applyBrand } from './js/brand.js';

applyBrand('Scoreboard', {
  current: 'Scoreboard',
  links: [
    { href: 'cheesybook.html', label: 'Home' },
    { href: 'scoreboard.html', label: 'Scoreboard' },
    { href: 'teams.html', label: 'Teams' },
    { href: 'lineups.html', label: 'Lineups' },
    { href: 'coach.html', label: 'Report' },
    { href: 'index.html', label: 'Rankings' },
  ],
});

const YEARS = [2026];
let index = null;
let day = null;
let byLeague = new Map();

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const TIEBREAK_LABEL = { sets: 'Sets', games: 'Games' };

const parts = (iso) => String(iso).split('-').map(Number);
function longDate(iso) {
  const [y, m, d] = parts(iso);
  return new Date(y, m - 1, d).toLocaleDateString(undefined,
    { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function shortDate(iso) {
  const [y, m, d] = parts(iso);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'numeric', day: 'numeric' });
}
const todayIso = () => new Date().toISOString().slice(0, 10);

// ---------------------------------------------------------------- filters

const F = ['gender', 'class', 'league', 'q'];
const val = (id) => document.getElementById(id).value.trim();
const anyFilter = () => F.some((id) => val(id));

function renderActiveFilters() {
  // A collapsed drawer must still say what it is hiding, or a filtered board
  // looks like a day with no matches.
  const on = F.filter((id) => val(id))
    .map((id) => `<span class="chip flag" data-clear="${id}">${esc(val(id))} &times;</span>`);
  const el = document.getElementById('active-filters');
  el.innerHTML = on.join('');
  el.querySelectorAll('[data-clear]').forEach((c) => {
    c.onclick = () => {
      document.getElementById(c.dataset.clear).value = '';
      renderActiveFilters();
      render();
    };
  });
  document.getElementById('filters-toggle').classList.toggle('on', anyFilter());
}

// ---------------------------------------------------------------- boot

async function boot() {
  const yearSel = document.getElementById('year');
  yearSel.innerHTML = YEARS.map((y) => `<option>${y}</option>`).join('');
  yearSel.onchange = () => loadYear(Number(yearSel.value));

  // Text search listens on input only. Binding change as well means clicking a
  // result blurs the box, fires change, re-renders the slate, and removes the
  // link under the cursor before the click lands — so nothing navigates.
  const refresh = () => { renderActiveFilters(); render(); };
  document.getElementById('q').oninput = refresh;
  for (const id of ['gender', 'class', 'league']) {
    document.getElementById(id).onchange = refresh;
  }
  document.getElementById('drawer-clear').onclick = () => {
    F.forEach((id) => { document.getElementById(id).value = ''; });
    renderActiveFilters();
    render();
  };
  const toggle = document.getElementById('filters-toggle');
  toggle.onclick = () => {
    const d = document.getElementById('drawer');
    d.hidden = !d.hidden;
  };

  document.getElementById('prev').onclick = () => step(1);
  document.getElementById('next').onclick = () => step(-1);

  await loadYear(YEARS[0]);
}

/** Move through the season's dates. Index 0 is the most recent. */
function step(delta) {
  const i = index.dates.findIndex((d) => d.date === day.date);
  const next = index.dates[i + delta];
  if (next) loadDate(next.date);
}

async function loadYear(year) {
  index = await fetch(`data/scoreboard/${year}/index.json`).then((r) => r.json());

  const classes = [...new Set(index.teams.map((t) => t.classification).filter(Boolean))].sort();
  document.getElementById('class').innerHTML =
    '<option value="">All</option>' + classes.map((c) => `<option>${esc(c)}</option>`).join('');

  byLeague = new Map();
  const leagues = new Map();
  for (const t of index.teams) {
    if (!t.league) continue;
    byLeague.set(t.id, t.league);
    if (!leagues.has(t.classification)) leagues.set(t.classification, new Set());
    leagues.get(t.classification).add(t.league);
  }
  document.getElementById('league').innerHTML = '<option value="">All</option>'
    + [...leagues.entries()].sort().map(([cls, set]) =>
      `<optgroup label="${esc(cls)}">`
      + [...set].sort().map((l) => `<option>${esc(l)}</option>`).join('')
      + '</optgroup>').join('');

  document.getElementById('date').innerHTML = index.dates.map((d) =>
    `<option value="${d.date}">${longDate(d.date)}</option>`).join('');
  document.getElementById('date').onchange = (e) => loadDate(e.target.value);

  // The strip runs oldest to newest so it reads like a calendar, even though
  // the index is newest first.
  const strip = [...index.dates].reverse();
  const today = todayIso();
  document.getElementById('daystrip').innerHTML = strip.map((d) =>
    `<button data-date="${d.date}" class="${d.date === today ? 'today' : ''}">${shortDate(d.date)}</button>`
  ).join('');
  document.querySelectorAll('#daystrip button').forEach((b) => {
    b.onclick = () => loadDate(b.dataset.date);
  });

  // Open on the most recent day with results — "what happened today".
  await loadDate(index.dates[0].date);
}

async function loadDate(date) {
  day = await fetch(`data/scoreboard/${index.year}/${date}.json`).then((r) => r.json());
  document.getElementById('date').value = date;
  document.querySelectorAll('#daystrip button').forEach((b) => {
    b.classList.toggle('on', b.dataset.date === date);
    if (b.dataset.date === date) b.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
  const i = index.dates.findIndex((d) => d.date === date);
  document.getElementById('prev').disabled = i >= index.dates.length - 1;
  document.getElementById('next').disabled = i <= 0;
  render();
}

// ---------------------------------------------------------------- render

function visible() {
  const gender = val('gender');
  const cls = val('class');
  const league = val('league');
  const q = val('q').toLowerCase();
  return day.duals.filter((d) => {
    if (gender && d.gender !== gender) return false;
    if (cls && d.a.classification !== cls && d.b.classification !== cls) return false;
    if (league && d.a.league !== league && d.b.league !== league
        && byLeague.get(d.a.id) !== league && byLeague.get(d.b.id) !== league) return false;
    if (q && !`${d.a.name} ${d.b.name}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function teamRow(side, dual) {
  const t = dual[side];
  const state = dual.tied ? '' : (dual.winnerId === t.id ? 'won' : 'lost');

  // The whole row is the link: wrapping only the name gives a target a few
  // glyphs wide that looks exactly like the text beside it.
  return `<a class="team-row ${state}" href="team.html?s=${encodeURIComponent(t.id)}&g=${esc(String(dual.gender).toLowerCase())}">
    <span class="mark">${state === 'won' ? '\u25B8' : ''}</span>
    <span class="name">${esc(t.name)}${t.record ? ` <span class="rec">${esc(t.record)}</span>` : ''}</span>
    <span class="score">${esc(t.score)}</span>
  </a>`;
}

function card(d, i) {
  const tags = [
    d.contested ? '<span class="chip flag">Disputed</span>' : '',
    d.source === 'entered' ? '<span class="chip aq">Reported</span>' : '',
  ].filter(Boolean).join(' ');
  // One metadata line, at the foot, in small type.
  const meta = d.conference ? d.a.league : '';
  return `<div class="game" data-i="${i}">
    <div class="game-head"><span class="final">${d.tied ? 'Final · Tie' : 'Final'}</span>${tags}</div>
    ${teamRow('a', d)}
    ${teamRow('b', d)}
    ${d.tiebreak ? `<div class="game-tb">${esc(TIEBREAK_LABEL[d.tiebreak.basis] || d.tiebreak.basis)} (${esc(d.tiebreak.a)}-${esc(d.tiebreak.b)})</div>` : ''}
    <div class="game-meta">${esc(meta)}</div>
    <div class="game-foot"><button class="js-box" data-i="${i}">Box score</button></div>
    <div class="box" id="box-${i}" style="display:none"></div>
  </div>`;
}

/** Girls then Boys, and inside each: conference, non-league, postseason. */
function group(list) {
  const kind = (d) => (d.postseason ? 'Postseason' : (d.conference ? 'Conference' : 'Non-league'));
  const out = [];
  for (const gender of ['Girls', 'Boys']) {
    const mine = list.filter((d) => d.gender === gender);
    if (!mine.length) continue;
    const subs = [];
    for (const k of ['Conference', 'Non-league', 'Postseason']) {
      const got = mine.filter((d) => kind(d) === k);
      if (got.length) subs.push([k, got]);
    }
    out.push([gender, subs]);
  }
  return out;
}

function render() {
  const list = visible();
  const slate = document.getElementById('slate');
  const empty = document.getElementById('empty');

  document.getElementById('dayhead').textContent = longDate(day.date);

  if (!list.length) {
    slate.innerHTML = '';
    empty.style.display = '';
    empty.textContent = anyFilter()
      ? 'No duals match those filters on this date.'
      : 'No duals were played on this date.';
    return;
  }
  empty.style.display = 'none';

  // Index against the filtered list so the box-score toggle stays aligned.
  let i = -1;
  slate.innerHTML = group(list).map(([gender, subs]) => `
    <section class="grp">
      <h2>${esc(gender)}</h2>
      ${subs.map(([kind, games]) => `
        <div class="sub-grp">
          <h3>${esc(kind)}</h3>
          <div class="slate">${games.map((d) => { i += 1; return card(d, i); }).join('')}</div>
        </div>`).join('')}
    </section>`).join('');

  // Flatten in the same order the cards were emitted.
  const flat = [];
  for (const [, subs] of group(list)) for (const [, games] of subs) flat.push(...games);
  slate.querySelectorAll('.js-box').forEach((b) => {
    b.onclick = () => toggleBox(Number(b.dataset.i), flat, b);
  });
}

// A team's lineup file, keyed the way the export names it: gender digit then
// school id. Computed rather than indexed, so no new export is needed to turn
// box-score names into links.
const teamKey = (schoolId, gender) =>
  `${String(gender).toLowerCase() === 'boys' ? 1 : 2}${schoolId}`;

const rosterCache = new Map();
async function rosterFor(schoolId, gender) {
  const key = teamKey(schoolId, gender);
  if (rosterCache.has(key)) return rosterCache.get(key);
  let map = null;
  try {
    const d = await fetch(`data/lineups/${index.year}/${key}.json`).then((r) => {
      if (!r.ok) throw new Error('none');
      return r.json();
    });
    map = new Map((d.ladder || []).map((pl) => [String(pl.name).trim().toLowerCase(), pl.pid]));
    map.key = key;
  } catch { /* team has no published lineup — names stay plain text */ }
  rosterCache.set(key, map);
  return map;
}

/** A player's name, linked to their card when we can resolve them. */
function playerLink(name, roster) {
  const pid = roster && roster.get(String(name).trim().toLowerCase());
  if (!pid) return esc(name);
  return `<a href="player.html?t=${encodeURIComponent(roster.key)}&p=${encodeURIComponent(pid)}">${esc(name)}</a>`;
}

async function toggleBox(i, list, button) {
  const mount = document.getElementById(`box-${i}`);
  if (mount.style.display !== 'none') {
    mount.style.display = 'none';
    button.textContent = 'Box score';
    return;
  }
  const d = list[i];
  // Both sides' rosters, so every name in the box score can become a link.
  const [rosterA, rosterB] = await Promise.all([
    rosterFor(d.a.id, d.gender), rosterFor(d.b.id, d.gender),
  ]);
  const rows = d.flights.map((f) => {
    const score = f.sets.map((s) =>
      `${s.home}-${s.away}${s.tie != null ? `(${s.tie})` : ''}`).join(', ');
    const name = (arr, roster) => (arr.length
      ? arr.map((n) => playerLink(n, roster)).join(' / ')
      : '<span class="muted">no player</span>');
    const finish = f.finish
      ? `<span class="fin">${f.finish === 'default' ? 'default' : 'ret.'}</span>` : '';
    return `<tr>
      <td class="slot">${esc(f.label)}</td>
      <td class="${f.home_won ? 'w' : 'l'}">${name(f.home_players, rosterA)}</td>
      <td class="${f.away_won ? 'w' : 'l'}">${name(f.away_players, rosterB)}</td>
      <td class="sc">${esc(score) || '&mdash;'} ${finish}</td>
    </tr>`;
  }).join('');

  mount.innerHTML = `<table>
    <thead><tr><th></th>
      <th><a href="team.html?s=${encodeURIComponent(d.a.id)}&g=${esc(String(d.gender).toLowerCase())}">${esc(d.a.name)}</a></th>
      <th><a href="team.html?s=${encodeURIComponent(d.b.id)}&g=${esc(String(d.gender).toLowerCase())}">${esc(d.b.name)}</a></th>
      <th class="sc">Score</th></tr></thead>
    <tbody>${rows}</tbody></table>`
    + (d.flights.length < 8
      ? `<p class="tiny muted" style="padding:6px 12px 0">Only ${d.flights.length} of the
         eight flights were contested.</p>` : '');
  mount.style.display = '';
  button.textContent = 'Hide';
}

boot();
</script>
</body>
</html>
