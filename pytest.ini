[pytest]
# Collect only tests/. The repository root holds ad-hoc scripts whose names
# begin with `test_` without being tests — `test_api_endpoints.py` is a manual
# TennisReporting API probe, and its `test_endpoint(url, params, description)`
# signature makes pytest try to inject fixtures called `url` and `params` and
# error out. Pinning the path here rather than in the CI command means a bare
# `pytest` behaves the same on a laptop as it does on the runner.
testpaths = tests
